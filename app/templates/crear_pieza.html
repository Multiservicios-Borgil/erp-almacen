{% extends "base.html" %}
{% block title %}Despiece{% endblock %}

{% block content %}
<div class="card">
    <h2>Despiece de Aparato: {{ parent_id }}</h2>
    <p>Selecciona la pieza que vas a extraer de este aparato.</p>

    <form method="post" action="/crear_pieza/{{ parent_id }}">
        <div class="form-group">
            <label>Tipo de pieza a extraer:</label>
            <select name="nombre_pieza" id="pieza_select" required style="width:100%; padding:12px; font-size:16px;">
                <option value="">-- Seleccionar pieza --</option>
            </select>
        </div>

        <div class="form-group" style="margin-top:20px;">
            <label>Medidas / Notas adicionales:</label>
            <input type="text" name="medidas" placeholder="ej: 30x15cm o 'Buen estado'" style="width:100%; padding:12px;">
        </div>

        <button type="submit" class="btn-primary" style="margin-top:20px; width:100%; padding:15px;">
            Registrar Pieza en Stock
        </button>
    </form>
</div>

<script>
    // Detectar la familia del padre automáticamente para cargar sus piezas
    // Hacemos una pequeña trampa: consultamos la ficha del padre para saber su familia
    fetch('/item/{{ parent_id }}')
        .then(response => response.text())
        .then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const familiaText = doc.body.innerText.match(/Familia:\s*(\w+)/);
            if (familiaText && familiaText[1]) {
                cargarPiezas(familiaText[1]);
            }
        });

    function cargarPiezas(familia) {
        fetch("/piezas_por_familia/" + familia)
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById("pieza_select");
                data.forEach(pieza => {
                    const option = document.createElement("option");
                    option.value = pieza;
                    option.text = pieza;
                    select.appendChild(option);
                });
            });
    }
</script>
{% endblock %}
