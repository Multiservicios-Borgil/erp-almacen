{% extends "base.html" %} {% block title %}Login{% endblock %}

{% block content %}

    <h2 style="text-align:center;margin-bottom:20px;">Acceso</h2>

    <form method="post" action="/login">

        <input 
            type="text" 
            name="username" 
            placeholder="Usuario"
            required
            style="width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #ccc;">

        <input 
            type="password" 
            name="password" 
            placeholder="Contraseña"
            required
            style="width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:1px solid #ccc;">

        <button 
            type="submit" 
            style="width:100%;padding:15px;background:#007bff;color:white;border:none;border-radius:10px;font-size:16px;">
            Entrar
        </button>

    </form>

{% endblock %}
