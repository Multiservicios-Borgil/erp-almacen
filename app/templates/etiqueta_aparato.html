<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
    font-family: Arial;
    text-align: center;
}

.etiqueta {
    border: 2px solid black;
    padding: 20px;
    width: 300px;
    margin: auto;
}

@media print {
    body {
        margin: 0;
    }

    body * {
        visibility: hidden;
    }

    .etiqueta, .etiqueta * {
        visibility: visible;
    }

    .etiqueta {
        position: absolute;
        top: 0;
        left: 0;
    }
}
</style>

</head>

<body onload="window.print()">

<div class="etiqueta">

    <h2>{{ item.id }}</h2>

    <p><b>Familia:</b> {{ item.familia.nombre if item.familia else "" }}</p>

    {% if item.marca %}
    <p><b>Marca:</b> {{ item.marca }}</p>
    {% endif %}

    {% if item.modelo %}
    <p><b>Modelo:</b> {{ item.modelo }}</p>
    {% endif %}

    <img src="/qr/{{item.id}}" width="150">

</div>

</body>
</html>
